---
layout: v2/default
---
<div class="ph ph--purple" style="padding-bottom:3rem">
  <div class="container" style="position:relative;z-index:1">
    <h1 class="ph__h1" id="legal-title">{{ page.page_title }}</h1>
    <p class="ph__sub"><strong>Effective Date:</strong> {{ page.effective_date }} &middot; <strong>Last Updated:</strong> {{ page.last_updated }}</p>
  </div>
</div>
<section class="ip-section" aria-labelledby="legal-title">
  <div class="container cs-article">
    {{ content }}
  </div>
</section>
