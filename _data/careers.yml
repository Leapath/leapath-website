founder:
  name: "Jai Eapen"
  title: "Founder & CEO, Leapath"
  note: "I started Leapath because I watched too many talented students get overlooked — not because they lacked ability, but because no one could measure it. We are building the data layer that fixes this, and we need people who care about that problem as much as we do. If you want to own real work, ship fast, and see your decisions directly help students land better careers — this is where you belong."

values:
  - title: "We ship, then we iterate"
    icon: "rocket"
    behavior: "We do not wait for perfect. We get something real in front of users, learn from it, and improve. If you have not shipped anything in two weeks, that is a conversation worth having."
  - title: "We write before we meet"
    icon: "pen"
    behavior: "Decisions, proposals, and feedback happen in writing first. Meetings are for alignment, not first-draft thinking. Clear writing is a skill we hire for and a habit we protect."
  - title: "We own the outcome, not the task"
    icon: "target"
    behavior: "You do not just complete a ticket. You own the result. If something is not working, you flag it and propose a fix — regardless of whose job it technically is."
  - title: "We disagree, then we commit"
    icon: "handshake"
    behavior: "We have strong opinions. We debate hard. But once a decision is made, everyone executes on it fully. Passive resistance is the one thing we do not tolerate."

perks:
  - icon: "globe"
    title: "Fully Remote"
    body: "Work from anywhere in India. We care about output, not office presence. Your calendar is yours to own."
  - icon: "clock"
    title: "Structured & focused"
    body: "9-to-6 working hours with a daily standup to keep the team aligned and moving fast."
  - icon: "retreat"
    title: "Annual Team Retreat"
    body: "The whole team meets once a year in person. Good food, real conversations, and a whiteboard session that actually shapes the roadmap."

team:
  - name: "Priya S."
    role: "Senior Engineer"
    initials: "PS"
    gradient: "135deg, #5B2D9E, #F042FF"
    before: "Previously at Infosys, then a Series A startup"
    quote: "At Leapath I shipped a feature in my first week that is now used by over 2,000 students daily. That kind of velocity and impact is genuinely addictive."
  - name: "Arjun M."
    role: "Product Designer"
    initials: "AM"
    gradient: "135deg, #7226FF, #F8B6DA"
    before: "Previously at a design agency, then B2B SaaS"
    quote: "The design decisions I make here actually matter to real people. No approval chains, no death-by-committee. Just taste, craft, and speed."
  - name: "Deepika R."
    role: "Growth Lead"
    initials: "DR"
    gradient: "135deg, #2D0F6F, #9B7FD4"
    before: "4 years in EdTech growth roles"
    quote: "I joined because the problem is real. Every TPO I speak with has the same pain point. We are the first team I have seen actually solving it with data."

process:
  - number: "01"
    title: "Application Review"
    duration: "Within 5 days"
    desc: "We read every application carefully. You will hear back from us within 5 days — always, even if the answer is no."
  - number: "02"
    title: "Intro Call"
    duration: "20 minutes"
    desc: "A relaxed conversation with the hiring manager. We want to understand how you think, not quiz you on trivia."
  - number: "03"
    title: "Assignment Round"
    duration: "2–3 hours"
    desc: "A focused take-home assignment relevant to the actual role. This is how we understand how you think and approach real problems."
  - number: "04"
    title: "Team Interview"
    duration: "1 hour"
    desc: "Meet 2–3 people from the team. Half technical depth, half culture fit. Bring your questions — we genuinely expect them."
  - number: "05"
    title: "Offer"
    duration: "Within 48 hours"
    desc: "If it is a yes, you will have a written offer within 48 hours. We do not ghost. We do not take three weeks. We respect your time."

openings:
  - id: "founders-office-intern-growth"
    title: "Founder's Office Intern — Growth"
    department: "Growth"
    dept_slug: "growth"
    location: "Remote — India"
    type: "Internship"
    type_slug: "internship"
    comp: "Unpaid · Certificate + PPO opportunity"
    exp: "Student / Fresher"
    status: open
    headline: "Work directly with the founders to shape and execute Leapath's GTM strategy from the ground up."
    description: "This is not a traditional internship where you shadow someone and write reports. You will work directly with the founders on the actual go-to-market strategy — identifying who we sell to, how we reach them, and what messaging works. You will run real outreach, see real pipeline data, and make decisions that affect how Leapath grows. If you want to understand how a B2B SaaS startup builds its market from scratch, this is that opportunity."
    responsibilities:
      - "Assist in developing and executing the GTM strategy for a B2B SaaS product in the edtech space"
      - "Identify and define Ideal Customer Profiles (ICPs) through research and outreach data"
      - "Support outreach initiatives including cold emails, LinkedIn engagement, and other acquisition channels"
      - "Conduct market research and competitor analysis to inform positioning"
      - "Help build and optimize growth funnels and messaging strategies"
      - "Track and analyze performance metrics for campaigns — weekly, with clear goals"
      - "Collaborate closely with founders on strategic initiatives and product direction"
    requirements:
      - "Pursuing a degree in Marketing, Business, Communications, or a related field"
      - "Strong written and verbal communication skills in English"
      - "Go-getter attitude — you take ownership without being asked twice"
      - "Ability to work independently in a remote setup with minimal supervision"
      - "Detail-oriented and well-organised"
    nice_to_have:
      - "Basic understanding of digital marketing concepts (funnels, ICPs, outreach)"
      - "Familiarity with tools like Google Analytics, CRM systems, or LinkedIn Sales Navigator"
      - "Prior experience in any customer-facing or outreach role"
      - "Genuine interest in edtech or B2B SaaS"
    questions:
      - "Why do you want to work at an early-stage startup specifically — not a larger company or agency?"
      - "Describe a time you had to figure something out with zero guidance. What did you do and what happened?"
    ninety_days: "By week 1 you understand the product, ICP, and where we currently stand on GTM. By month 1 you have run your first outreach campaign and have real data to share. By month 2 you own specific acquisition channels end-to-end. By the end of the internship you have a documented playbook of what worked and what did not — and your name is on it."

  - id: "founders-office-intern-college-partnerships"
    title: "Founder's Office Intern — College Partnerships"
    department: "Partnerships"
    dept_slug: "partnerships"
    location: "Remote — India"
    type: "Internship"
    type_slug: "internship"
    comp: "Unpaid · Certificate + PPO opportunity"
    exp: "Student / Fresher"
    status: open
    headline: "Work directly with the founders to build college relationships and drive Leapath's go-to-market through institutional partnerships."
    description: "This is a high-ownership role for someone who enjoys sales, outreach, and solving problems. You will work directly with the founders to identify and engage Training & Placement Officers (TPOs), introduce Leapath's platform, and onboard colleges onto our pilot program. If you are ambitious, target-driven, and eager to prove yourself, this role offers unmatched startup exposure."
    responsibilities:
      - "Research colleges and identify decision-makers, especially Training & Placement Officers (TPOs)"
      - "Conduct outbound calls, emails, and LinkedIn outreach to generate qualified conversations"
      - "Present Leapath's value proposition and schedule product demonstrations"
      - "Drive onboarding of colleges onto Leapath's 6-month free pilot"
      - "Build relationships and maintain regular follow-ups"
      - "Use ChatGPT, Claude, and other AI tools to research prospects, personalise outreach, and improve productivity"
      - "Write high-quality prompts by providing the right business context to AI tools"
      - "Maintain CRM records and consistently achieve outreach and onboarding targets"
      - "Work independently with minimal supervision while collaborating closely with the founders"
    requirements:
      - "Go-getter attitude with a strong desire to learn and outperform expectations"
      - "Excellent written and verbal communication skills in English"
      - "Comfortable speaking with senior stakeholders over phone and video calls"
      - "Ability to work with targets, KPIs, and deadlines"
      - "Strong research and analytical skills"
      - "Self-driven, resourceful, and able to work with minimal supervision"
    nice_to_have:
      - "Comfortable with LinkedIn and digital productivity tools"
      - "Hands-on experience using ChatGPT, Claude, or similar AI tools"
      - "Excellent prompt engineering skills — understanding objectives, providing context, and delivering high-quality outputs"
      - "Prior experience in any sales, outreach, or customer-facing role"
    questions:
      - "Describe a time you convinced someone who was initially skeptical. What was your approach and what happened?"
      - "You have a list of 50 colleges and one week to generate 10 qualified conversations. Walk us through exactly how you would do it."
    ninety_days: "By week 1 you understand Leapath's product, the TPO persona, and our outreach playbook. By month 1 you have completed your first outbound calls and emails and have real conversations to report back on. By month 2 you own a defined segment end-to-end. By the end of the internship you have onboarded at least 2–3 colleges onto the pilot and have a documented record of what worked and what did not — with your name on it."

  - id: "psychometrician-advisory-gcc"
    title: "Advisory Engagement — Psychometrician"
    department: "Advisory"
    dept_slug: "advisory"
    location: "GCC Region"
    type: "Advisory"
    type_slug: "advisory"
    comp: "Engagement fee · To be discussed"
    exp: "PhD + 10 years"
    status: open
    headline: "Shape a nationally significant Career Guidance & Psychometric Assessment Platform being built for the GCC region."
    description: "This is a high-impact advisory engagement — not a traditional employment role. You will contribute your expertise to the design and validation of a large-scale national Career Guidance & Psychometric Assessment Platform in the GCC region. The platform will directly influence how thousands of individuals are guided toward career pathways and talent development outcomes at a national level. You will work with a cross-functional team on test construction, standardisation, reliability and validity frameworks, and competency assessment architecture."
    responsibilities:
      - "Advise on the psychometric design and validation framework for a national career guidance platform"
      - "Guide test construction, item development, and standardisation methodologies"
      - "Lead or review reliability and validity studies across assessment instruments"
      - "Provide expertise on competency-based assessment design aligned to workforce and career outcomes"
      - "Collaborate with government, university, and workforce development stakeholders in the GCC region"
      - "Review and quality-assure assessment outputs against international psychometric standards"
    requirements:
      - "PhD in Psychology, Psychometrics, Educational Measurement, or a closely related field"
      - "10+ years of hands-on experience in psychometric assessment development and validation"
      - "Proven track record in test construction, standardisation, and reliability & validity studies"
      - "Experience with competency assessments or large-scale educational and career assessment projects"
    nice_to_have:
      - "Prior engagement with governments, national programs, universities, or workforce development initiatives"
      - "Familiarity with GCC or MENA region educational or talent development contexts"
      - "Published research or recognised contributions in psychometrics or educational measurement"
    questions:
      - "Describe a large-scale psychometric assessment project you have led or significantly contributed to. What was the scope and what were the key validation challenges?"
      - "How do you approach standardisation when working across diverse population groups or educational contexts?"
    ninety_days: "Early engagement will focus on reviewing the existing assessment framework and identifying gaps. You will then lead the validation design and guide the team through standardisation. The engagement is structured around advisory milestones, not a fixed daily schedule — designed to fit around your existing commitments."
