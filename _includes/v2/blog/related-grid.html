<section class="ip-section ip-section--soft">
  <div class="container">
    <div class="ip-eyebrow">{{ include.eyebrow | default: "Keep reading" }}</div>
    <h3 class="ip-h2" style="font-size:1.6rem;margin-bottom:2rem">{{ include.heading | default: "Related insights" }}</h3>
    <div class="bp__related-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem">
      {% for item in include.items %}
      <a href="{{ item.url }}" class="bc">
        <div class="bc__img" style="background-image:url('{{ item.img }}');background-size:cover;background-position:center"></div>
        <div class="bc__body">
          <div class="bc__tag">{{ item.tag }}</div>
          <div class="bc__t">{{ item.title }}</div>
          <div class="bc__meta"><span>{{ item.meta }}</span></div>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
