<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ page.canonical | default: site.url | append: page.url }}">
<link rel="icon" type="image/x-icon" href="/assets/v2/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/v2/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/v2/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/v2/apple-touch-icon.png">
<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:site_name" content="Leapath">
<meta property="og:title" content="{{ page.og_title | default: page.title }}">
<meta property="og:description" content="{{ page.og_description | default: page.description }}">
<meta property="og:url" content="{{ page.canonical | default: site.url | append: page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/v2/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.twitter_title | default: page.title }}">
<meta name="twitter:description" content="{{ page.twitter_description | default: page.description }}">
<meta name="twitter:image" content="{{ site.url }}/assets/v2/og-image.png">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Organization", "name": "Leapath", "legalName": "Leapath Ventures Pvt Ltd", "url": "{{ site.url }}/", "logo": "{{ site.url }}/assets/v2/icon-512.png", "description": "The platform Career Services teams rely on to guide every student toward the right career.", "email": "info@leapath.tech", "address": {"@type": "PostalAddress", "streetAddress": "MS Bright Plaza, 3-84/22, Manikonda, Puppalaguda", "addressLocality": "Hyderabad", "addressRegion": "Telangana", "postalCode": "500089", "addressCountry": "IN"}, "sameAs": ["https://www.linkedin.com/company/leapath/", "https://x.com/leapathtech", "https://www.youtube.com/@leapathtech", "https://www.instagram.com/leapathtech/", "https://www.facebook.com/profile.php?id=61591903441092", "https://www.pinterest.com/leapathtech/", "https://bsky.app/profile/leapath.bsky.social", "https://www.threads.com/@leapathtech"]}</script>
{% if page.og_type == 'article' %}
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Article", "name": "{{ page.title }}", "headline": "{{ page.title }}", "description": "{{ page.description }}", "url": "{{ page.canonical | default: site.url | append: page.url }}", "image": "{{ site.url }}/assets/v2/og-image.png", "publisher": {"@type": "Organization", "name": "Leapath", "logo": {"@type": "ImageObject", "url": "{{ site.url }}/assets/v2/icon-512.png"}}, "author": {"@type": "Organization", "name": "Leapath"}}</script>
{% else %}
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebPage", "name": "{{ page.title }}", "description": "{{ page.description }}", "url": "{{ page.canonical | default: site.url | append: page.url }}", "image": "{{ site.url }}/assets/v2/og-image.png"}</script>
{% endif %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/v2/theme.css?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="/css/v2/case-studies.css?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="/css/v2/blog-post.css?v={{ site.time | date: '%s' }}">
{% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css }}?v={{ site.time | date: '%s' }}">{% endif %}
</head>
