<div class="ty-modal-overlay" id="tyModalOverlay" hidden>
  <div class="ty-modal" role="dialog" aria-modal="true" aria-labelledby="tyModalTitle" aria-describedby="tyModalMessage" tabindex="-1">
    <button type="button" class="ty-modal__close" id="tyModalClose" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="ty-modal__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h3 id="tyModalTitle">Thank you!</h3>
    <p id="tyModalMessage">Your submission has been received.</p>
    <button type="button" class="btn btn-grad" id="tyModalOk">Got it</button>
  </div>
</div>
