{% assign wn = site.content | where: "slug", "why-now" | first %}
<section id="why-now" class="section section--mid" aria-labelledby="why-now-heading">
  <div class="container">

    <div class="reveal" style="max-width: 780px;">
      <div class="section-label"><span class="label">{{ wn.label }}</span></div>
      <h2 class="display-2" id="why-now-heading">{{ wn.heading }}</h2>
      <p class="subheading mt-sm">{{ wn.subheading }}</p>
      <p class="why-now-urgency">{{ wn.urgency }}</p>
    </div>

    <div class="why-now-grid reveal">
      {% for card in wn.cards %}
      <div class="why-now-card">
        <div class="why-now-card__stat">{{ card.stat }}</div>
        <div class="why-now-card__claim">{{ card.claim }}</div>
        <div class="why-now-card__source">{{ card.source }}</div>
      </div>
      {% endfor %}
    </div>

    <div class="why-now-conclusion reveal">{{ wn.conclusion }}</div>

  </div>
</section>
