{% assign h = site.content | where: "slug", "hero" | first %}
<section id="hero" aria-labelledby="hero-headline">
  <div class="container">
    <div class="hero__inner">

      <div class="hero__logo-animation intro-anim intro-anim--logo" aria-hidden="true">
        <span class="hero__logo-line"></span>
        <div class="hero__logo-image-wrap">
          <img src="/assets/logos/logo-hero.png" alt="Leapath" class="hero__logo-image" />
        </div>
      </div>

      <div class="hero__eyebrow intro-anim intro-anim--1" role="text">{{ h.eyebrow }}</div>

      <h1 class="hero__headline intro-anim intro-anim--2" id="hero-headline">
        {{ h.headline }}
      </h1>

      <p class="hero__punch intro-anim intro-anim--3">{{ h.punch }}</p>

      <p class="hero__sub intro-anim intro-anim--4">{{ h.sub }}</p>

      <div class="hero__ctas intro-anim intro-anim--5">
        <a href="{{ h.cta_primary_href }}" class="btn btn-primary btn-lg">{{ h.cta_primary_text }}</a>
        <a href="{{ h.cta_secondary_href }}" class="btn btn-outline btn-lg">{{ h.cta_secondary_text }}</a>
      </div>
      <p class="hero__cta-microcopy intro-anim intro-anim--6">{{ h.microcopy }}</p>

      <div class="hero__audience intro-anim intro-anim--6" aria-label="Quick links by audience">
        {% for card in h.audience_cards %}
        <a href="{{ card.href }}" class="hero__aud-card">
          <div class="hero__aud-icon">
            <img src="{{ card.icon }}" alt="">
          </div>
          <div class="hero__aud-content">
            <div class="hero__aud-title">{{ card.title }}</div>
            <div class="hero__aud-desc">{{ card.desc }}</div>
          </div>
          <div class="hero__aud-arrow" aria-hidden="true">→</div>
        </a>
        {% endfor %}
      </div>

    </div>
  </div>
</section>
