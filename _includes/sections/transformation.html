{% assign tr = site.content | where: "slug", "transformation" | first %}
<section id="transformation" class="section section--mid" aria-labelledby="transformation-heading">
  <div class="container">

    <div class="text-center reveal" style="max-width: 760px; margin-inline: auto;">
      <div class="section-label" style="justify-content: center;"><span class="label">{{ tr.label }}</span></div>
      <h2 class="display-2" id="transformation-heading">{{ tr.heading }}</h2>
      <p class="subheading mt-sm" style="margin-inline: auto;">{{ tr.subheading }}</p>
    </div>

    <div class="compare-table reveal mt-md">

      <div class="compare-row compare-row--head">
        <div class="compare-cell compare-cell--label">Dimension</div>
        <div class="compare-cell compare-cell--without">Without Leapath</div>
        <div class="compare-cell compare-cell--with">With Leapath</div>
      </div>

      {% for row in tr.rows %}
      <div class="compare-row">
        <div class="compare-cell compare-cell--label">{{ row.dimension }}</div>
        <div class="compare-cell compare-cell--without"><span class="compare-icon compare-icon--x">✕</span>{{ row.without }}</div>
        <div class="compare-cell compare-cell--with"><span class="compare-icon compare-icon--ok">✓</span>{{ row.with }}</div>
      </div>
      {% endfor %}

    </div>

    <p class="moat-assertion reveal">{{ tr.moat }}</p>

  </div>
</section>
