title: Leapath
description: Placement Intelligence Platform for Colleges & TPOs
url: "https://www.leapath.tech"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# All collections live under _data/ for clean organisation
collections_dir: _data

collections:
  content:
    output: false
  product_cards:
    output: false
  steps:
    output: false
  training_cards:
    output: false
  powers_cards:
    output: false
  insight_cards:
    output: false
  testimonial_cards:
    output: false
  onboarding_steps:
    output: false
  v2_content:
    output: false
  v2_roles:
    output: false
  v2_capabilities:
    output: false
  v2_pricing_tiers:
    output: false
  v2_how_steps:
    output: false
  v2_open_roles:
    output: false
  v2_testimonials:
    output: false
  v2_careers_values:
    output: false
  v2_careers_process:
    output: false
  v2_careers_pride:
    output: false
  v2_posts:
    output: true

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Sitemap settings (jekyll-sitemap)
sitemap:
  file: "/sitemap.xml"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - package-lock.json
  - vercel.json
  - components/
  - node_modules/
  - .bundle/
  - vendor/
